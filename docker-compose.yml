services:
  app:
    build: ./app
    container_name: python-app
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      - postgres
    ports:
      - "80:8080"
    volumes:
      - ./app:/var/www/html
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres-data
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
