<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Manipulation</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .div1 {
        display: flex;
        gap: 4rem;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html">Main Page</a>
      <a href="list-manipulation.html">List Manipulation</a>
      <a href="database-interaction.html">Database Interaction</a>
    </nav>
    <h1>List manipulation</h1>

    <div class="div1">
      <div>
        <div>
          <button type="button" id="add-list">Create fruit UL list</button>
        </div>
        <ul id="fruit-list"></ul>
      </div>
      <div>
        <div>
          <button type="button" id="add-table">Create fruit table</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Fruit</th>
            </tr>
          </thead>
          <tbody id="fruit-table-body"></tbody>
        </table>
      </div>

      <div>
        <form id="count-fruit">
          <input type="text" name="fruit" placeholder="e.g. melon" required />

          <button type="submit">Count Fruit</button>
        </form>
        <div class="result-div" id="fruit-error" style="color: red"></div>
        <div class="result-div" id="fruit-result"></div>
      </div>
    </div>
  </body>
  <script>
    const addList = document.getElementById("add-list");
    const addTable = document.getElementById("add-table");
    const fruitList = document.getElementById("fruit-list");
    const fruitTableBody = document.getElementById("fruit-table-body");
    const fruitError = document.getElementById("fruit-error");

    //uses forEach no new array just display
    addList.addEventListener("click", () => {
      fruitError.textContent = "";
      fetch("/api/run/list_manipulation/upload_fruits")
        .then((res) => res.json())
        .then((data) => {
          if (data.error) {
            fruitError.textContent = data.error;
            return;
          }
          fruitList.textContent = "";
          data.forEach((fruitItem) => {
            const li = document.createElement("li");
            li.textContent = `${fruitItem.id} - ${fruitItem.fruit};`;
            fruitList.appendChild(li);
          });
        })
        .catch(() => {
          fruitError.textContent = "Could not load fruits.";
        });
    });

    //uses .map() create new array
    addTable.addEventListener("click", () => {
      fruitError.textContent = "";
      fetch("/api/run/list_manipulation/upload_fruits")
        .then((res) => res.json())
        .then((data) => {
          if (data.error) {
            fruitError.textContent = data.error;
            return;
          }
          fruitTableBody.textContent = "";
          const rows = data.map((fruitItem) => {
            const tr = document.createElement("tr");

            const idCell = document.createElement("td");
            idCell.textContent = fruitItem.id;

            const fruitCell = document.createElement("td");
            fruitCell.textContent = fruitItem.fruit;

            tr.append(idCell, fruitCell);
            return tr;
          });
          fruitTableBody.append(...rows);
        })
        .catch(() => {
          fruitError.textContent = "Could not load fruits.";
        });
    });

    const countFruit = document.getElementById("count-fruit");
    const fruitResult = document.getElementById("fruit-result");

    countFruit.addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target;
      fruitError.textContent = "";
      fruitResult.textContent = "";

      const fruit = form.fruit.value.trim();

      // Client-side check: fast feedback only, not security.
      // The backend re-validates because this can be bypassed.
      if (!fruit) {
        fruitError.textContent = "Enter a fruit name.";
        return;
      }

      fetch("/api/run/list_manipulation/count_fruit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(fruit),
      })
        .then((res) => res.json())
        .then((data) => {
          if (data.error) {
            fruitError.textContent = data.error;
            return;
          }
          fruitResult.textContent = `${data.fruit}: ${data.count}`;
        });
    });
  </script>
</html>
